name = "sudoku"
version = "1.0.0"
description = "A Sudoku game for the terminal"

# Raw keyboard input goes through shell:start_interactive/1, so the Erlang
# target is required, and OTP 26+ for keys that do not need Enter after them.
#
# OTP 27 is the floor all the same, and it is not ours: gleam_stdlib will not
# compile below it, its Erlang using syntax that arrived in 27.
#
# Nor is the Gleam floor ours. stdlib asks for 1.14, but 1.14 does not build
# this: gleeunit never compiles under it and the tests cannot find it. 1.15
# is the lowest that does, and it was found by asking rather than by reading
# what the dependencies say. Both floors are legs of the workflow now, so
# neither can quietly stop being true.
target = "erlang"
gleam = ">= 1.15.0"

licences = ["MIT"]
repository = { type = "github", user = "nerggnet", repo = "sudoku" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
